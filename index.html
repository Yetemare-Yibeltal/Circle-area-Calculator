<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Engine Studio - Geometric Computing & Vector Suite</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/controls.css">
    <link rel="stylesheet" href="assets/css/canvas.css">
    <link rel="stylesheet" href="assets/css/charts.css">
    <link rel="stylesheet" href="assets/css/modals.css">
    <link rel="stylesheet" href="assets/css/tooltips.css">
    <link rel="stylesheet" href="assets/css/editor.css">
    <link rel="stylesheet" href="assets/css/themes.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <h1>Circle Engine Studio</h1>
                <span id="fpsCounter" style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-secondary);">FPS: --</span>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button id="themeToggle" class="btn btn-secondary">Theme</button>
                <button id="customThemeBtn" class="btn btn-secondary">Palette Editor</button>
                <button id="historyBtn" class="btn btn-secondary">History</button>
                <button id="exportBtn" class="btn btn-primary">Export Data</button>
            </div>
        </header>

        <main class="app-content">
            <aside class="sidebar-panel">
                <div class="panel-card" id="inputSection"></div>
                <div class="panel-card" id="presetSection"></div>
                <div class="panel-card" id="physicsSection">
                    <div class="control-label" style="margin-bottom: 0.5rem;">Physics Simulation</div>
                    <button id="toggleParticlesBtn" class="btn btn-secondary" style="width: 100%;">Enable Elastic Particles</button>
                </div>
            </aside>

            <section class="viewport-panel">
                <div class="canvas-wrapper" id="canvasContainer">
                    <canvas id="geometryCanvas"></canvas>
                    <div class="canvas-overlay">
                        <div>Center: (0, 0)</div>
                        <div id="cursorCoords">Hover to track coordinate</div>
                    </div>
                </div>
            </section>

            <aside class="sidebar-panel">
                <div class="panel-card" id="metricsDisplay"></div>
                <div class="panel-card" id="polygonDisplay"></div>
                <div class="panel-card" id="geometry3dDisplay"></div>
                <div class="panel-card" id="chartSection"></div>
            </aside>
        </main>

        <footer class="app-footer">
            Circle Engine Studio &copy; Metages Yibeltal — Advanced Portfolio Engineering Suite
        </footer>
    </div>

    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
